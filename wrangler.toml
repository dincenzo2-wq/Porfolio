name = "tran-quoc-vinh-portfolio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "your-d1-database-uuid"

# Cloudflare R2 Bucket Binding (for compressed WebP image assets)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "portfolio-media"

# Optional Environment Variables
[vars]
R2_PUBLIC_URL = "https://media.quocvinh.film"
